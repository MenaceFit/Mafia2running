<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1080px;background:#0a0a0a;font-family:"Inter Display",Inter,"Noto Color Emoji",sans-serif;color:#fff}
.c{position:relative;width:1080px;height:1080px;overflow:hidden;background:radial-gradient(60% 45% at 50% 28%,rgba(212,175,55,.22),transparent 70%),radial-gradient(80% 30% at 50% 0%,rgba(212,175,55,.18),transparent 70%),#0a0a0a;display:grid;justify-items:center;align-content:start;text-align:center;padding-top:72px}
.c::after{content:"";position:absolute;inset:36px;border-radius:44px;border:2px solid rgba(212,175,55,.5);pointer-events:none}
.brand{letter-spacing:.3em;font-weight:700;font-size:30px;color:#D4AF37}
.row{display:flex;gap:26px;margin-top:44px;align-items:center}
.ph{width:200px;height:200px;border-radius:50%;overflow:hidden;border:5px solid #D4AF37;box-shadow:0 0 50px rgba(212,175,55,.55)}
.ph img{width:100%;height:100%;object-fit:cover}
.icon{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#FBE9A8,#D4AF37 50%,#A8822A);box-shadow:0 0 60px rgba(212,175,55,.6)}
.kick{margin-top:42px;letter-spacing:.14em;font-weight:700;font-size:50px}
.t{margin-top:22px;font-weight:800;font-size:112px;line-height:.98;letter-spacing:-.035em}
.g{background:linear-gradient(135deg,#FBE9A8,#D4AF37 50%,#A8822A);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{margin-top:40px;padding:20px 40px;border-radius:999px;font-weight:800;font-size:42px;color:#111;background:linear-gradient(135deg,#FBE9A8,#D4AF37 50%,#A8822A)}
.foot{position:absolute;bottom:70px;left:0;right:0;font-size:30px;color:#9a9a9a;letter-spacing:.03em}
</style></head><body><div class="c">
